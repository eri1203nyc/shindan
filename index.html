<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自分に合った働き方が分かる強み診断</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #c8857a;
  --rose-light: #f2e4e1;
  --rose-pale: #faf5f4;
  --teal: #3d8b85;
  --teal-dark: #2a6b66;
  --brown: #6b4c3b;
  --brown-light: #a07060;
  --cream: #fdf9f7;
  --text: #3d2c25;
  --text-light: #7a5c50;
  --border: #e8d5cf;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--rose-pale);
  color: var(--text);
  min-height: 100vh;
}

/* ===== HEADER ===== */
.header {
  background: var(--cream);
  border-bottom: 1px solid var(--border);
  padding: 2rem 1rem 1.5rem;
  text-align: center;
}
.header-diamond {
  color: var(--rose);
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
}
.header h1 {
  font-family: 'Noto Serif JP', serif;
  font-size: clamp(1.1rem, 4vw, 1.5rem);
  font-weight: 600;
  color: var(--brown);
  line-height: 1.5;
}
.header p {
  font-size: 0.82rem;
  color: var(--text-light);
  margin-top: 0.4rem;
}

/* ===== SCREENS ===== */
.screen { display: none; }
.screen.active { display: block; }

/* ===== INTRO ===== */
.intro-wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 2rem 1.2rem 3rem;
}
.intro-card {
  background: var(--cream);
  border-radius: 16px;
  padding: 2rem 1.5rem;
  border: 1px solid var(--border);
  text-align: center;
}
.intro-card h2 {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.15rem;
  color: var(--brown);
  margin-bottom: 1rem;
}
.intro-card p {
  font-size: 0.88rem;
  color: var(--text-light);
  line-height: 1.8;
  margin-bottom: 1.5rem;
}
.form-group {
  text-align: left;
  margin-bottom: 1rem;
}
.form-group label {
  display: block;
  font-size: 0.82rem;
  color: var(--brown);
  font-weight: 500;
  margin-bottom: 0.4rem;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 0.6rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.88rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--rose);
}
.btn-start {
  width: 100%;
  padding: 0.9rem;
  background: var(--rose);
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  margin-top: 0.5rem;
  transition: background 0.2s, transform 0.1s;
}
.btn-start:hover { background: var(--brown-light); }
.btn-start:active { transform: scale(0.98); }

/* ===== QUESTIONS ===== */
.q-wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 1.5rem 1.2rem 3rem;
}
.progress-bar-wrap {
  margin-bottom: 1.5rem;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text-light);
  margin-bottom: 0.4rem;
}
.progress-track {
  height: 4px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--rose);
  border-radius: 99px;
  transition: width 0.4s ease;
}
.axis-badge {
  display: inline-block;
  padding: 0.2rem 0.7rem;
  border-radius: 99px;
  font-size: 0.75rem;
  font-weight: 500;
  margin-bottom: 0.8rem;
}
.axis-1 { background: #eeedfe; color: #3c3489; }
.axis-2 { background: #e1f5ee; color: #085041; }
.axis-3 { background: #faece7; color: #4a1b0c; }
.axis-4 { background: #faeeda; color: #412402; }

.q-card {
  background: var(--cream);
  border-radius: 16px;
  padding: 1.8rem 1.5rem;
  border: 1px solid var(--border);
  margin-bottom: 1rem;
}
.q-number {
  font-size: 0.75rem;
  color: var(--text-light);
  margin-bottom: 0.5rem;
}
.q-text {
  font-family: 'Noto Serif JP', serif;
  font-size: 0.98rem;
  color: var(--brown);
  line-height: 1.7;
  margin-bottom: 1.2rem;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.choice-btn {
  width: 100%;
  padding: 0.85rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: white;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.85rem;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.5;
}
.choice-btn:hover {
  border-color: var(--rose);
  background: var(--rose-light);
}
.choice-btn.selected {
  border-color: var(--rose);
  background: var(--rose-light);
  color: var(--brown);
  font-weight: 500;
}
.choice-label {
  display: inline-block;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--rose-light);
  color: var(--rose);
  font-weight: 600;
  font-size: 0.8rem;
  text-align: center;
  line-height: 22px;
  margin-right: 0.5rem;
  flex-shrink: 0;
}
.choice-btn.selected .choice-label {
  background: var(--rose);
  color: white;
}
.choice-inner { display: flex; align-items: flex-start; gap: 0; }

.nav-btns {
  display: flex;
  gap: 0.8rem;
  margin-top: 0.5rem;
}
.btn-prev {
  padding: 0.75rem 1.2rem;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: white;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.88rem;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-prev:hover { border-color: var(--rose); color: var(--rose); }
.btn-next {
  flex: 1;
  padding: 0.75rem;
  background: var(--rose);
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-next:hover { background: var(--brown-light); }
.btn-next:disabled { background: var(--border); cursor: not-allowed; }

.axis-summary {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem 1.2rem;
  margin-bottom: 1rem;
  font-size: 0.82rem;
  color: var(--text-light);
}
.axis-summary strong { color: var(--brown); }

/* ===== RESULT ===== */
.result-wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1.2rem 4rem;
}
.result-header {
  background: var(--cream);
  border-radius: 16px;
  padding: 1.8rem 1.5rem;
  border: 1px solid var(--border);
  text-align: center;
  margin-bottom: 1.2rem;
}
.result-greeting {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 0.3rem;
}
.result-name-display {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.3rem;
  color: var(--brown);
  margin-bottom: 1rem;
}
.result-axes {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 0.8rem;
}
.axis-result-pill {
  padding: 0.3rem 0.9rem;
  border-radius: 99px;
  font-size: 0.78rem;
  font-weight: 500;
}

.result-section {
  background: var(--cream);
  border-radius: 16px;
  padding: 1.5rem;
  border: 1px solid var(--border);
  margin-bottom: 1rem;
}
.result-section-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 0.92rem;
  color: var(--teal);
  font-weight: 600;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}
.result-section-title.hidden-strength {
  color: var(--brown-light);
}
.result-section-title.like { color: var(--teal); }
.result-section-title.dislike { color: var(--brown-light); }
.result-section-title.workstyle { color: var(--teal-dark); }

.result-items {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.result-items li {
  font-size: 0.87rem;
  color: var(--text);
  line-height: 1.6;
  padding-left: 1rem;
  position: relative;
}
.result-items li::before {
  content: '・';
  position: absolute;
  left: 0;
  color: var(--rose);
}

.result-text {
  font-size: 0.87rem;
  color: var(--text);
  line-height: 1.9;
}

.cta-section {
  background: linear-gradient(135deg, #f5e8e5 0%, #e8f2f0 100%);
  border-radius: 16px;
  padding: 1.8rem 1.5rem;
  border: 1px solid var(--border);
  margin-bottom: 1rem;
  text-align: center;
}
.cta-section h3 {
  font-family: 'Noto Serif JP', serif;
  font-size: 1rem;
  color: var(--brown);
  margin-bottom: 0.8rem;
  line-height: 1.6;
}
.cta-section p {
  font-size: 0.83rem;
  color: var(--text-light);
  line-height: 1.8;
  margin-bottom: 1.2rem;
}
.email-form {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.email-input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.88rem;
  outline: none;
  background: white;
  transition: border-color 0.2s;
}
.email-input:focus { border-color: var(--rose); }
.btn-register {
  width: 100%;
  padding: 0.9rem;
  background: var(--teal);
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.92rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-register:hover { background: var(--teal-dark); }

.btn-retry {
  width: 100%;
  padding: 0.75rem;
  background: transparent;
  color: var(--text-light);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 0.5rem;
}
.btn-retry:hover { border-color: var(--rose); color: var(--rose); }

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
@media (max-width: 480px) {
  .two-col { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-diamond">◆</div>
  <h1>自分に合った働き方が分かる<br>強み診断</h1>
  <p>約20問であなたの生まれ持つ特性・強みを診断します</p>
</div>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <div class="intro-wrap">
    <div class="intro-card">
      <h2>はじめに</h2>
      <p>心理学と脳科学を取り入れた特性分析で、あなたのものの見方や意思決定の仕方を推測・診断します。<br>直感で答えてください。</p>
      <button class="btn-start" onclick="startDiagnosis()">診断スタート →</button>
    </div>
  </div>
</div>

<!-- QUESTIONS -->
<div id="screen-questions" class="screen">
  <div class="q-wrap">
    <div class="progress-bar-wrap">
      <div class="progress-label">
        <span id="progress-text">質問 1 / 20</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div id="axis-badge-wrap"></div>
    <div class="q-card">
      <div class="q-number" id="q-number"></div>
      <div class="q-text" id="q-text"></div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="nav-btns">
      <button class="btn-prev" id="btn-prev" onclick="prevQ()">← 戻る</button>
      <button class="btn-next" id="btn-next" onclick="nextQ()" disabled>次へ →</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="result-wrap" id="result-content"></div>
</div>

<script>
const QUESTIONS = [
  // 軸1 (A/B) I/E
  { axis:1, text:'疲れている時やストレスが溜まった時には？', a:'一人の時間が欲しくなる。', b:'（家族・親友以外の人）と一緒に過ごしたい。' },
  { axis:1, text:'人と会話する時には？', a:'聞き役になることが多い。', b:'自分が話すことが多い。' },
  { axis:1, text:'交友関係は？', a:'狭く深い方だ。', b:'広く浅い方だ。' },
  { axis:1, text:'これまでの交友関係を振り返り、より楽しんできたのは？', a:'一対一もしくは少人数でじっくり話すこと', b:'大勢の集団でワイワイすること' },
  { axis:1, text:'1週間、どちらかの状況で過ごすなら？', a:'電話やLINEなどの連絡手段も使えない状態で一人きりで過ごす', b:'初対面の人も含む集団の中で過ごす' },
  // 軸2 (C/D) S/N
  { axis:2, text:'飽きることなく、より長い時間続けられるのは？', a:'近況報告や思い出話など、具体的で地に足の着いた話', b:'抽象的な話、物事の背景を考えること（推測や洞察）' },
  { axis:2, text:'物事や出来事について、より当てはまるのは？', a:'余計な解釈を挟まず額面通り受け止める。', b:'物事や出来事の間に関連性やパターンを見付け、何が言えそうか考えるのが好きだ。' },
  { axis:2, text:'何かを説明する時は？', a:'できるだけ情報を落とさず詳細に伝える。', b:'よく例えを使い、概要を伝える。' },
  { axis:2, text:'新しいことを学ぶ時、最初に知りたいのは？', a:'具体例やハウツーだ。', b:'全体像や目的だ。' },
  { axis:2, text:'飽きることなくより長い時間続けられるのは？', a:'自ら手を動かしやってみること・体を使って体験すること', b:'本やネットで情報収集し、それをもとにあれこれ思考すること' },
  { axis:2, text:'新しいアイデアが浮かぶのは？', a:'体や手先を動かす、シャワーを浴びる、自然の中を散歩するなど、五感を使っている時', b:'人と話している時' },
  { axis:2, text:'より好きなのは？', a:'地に足のついた議論をすること', b:'物事を何かに例えたり、人と話しながらアイデアを自由に膨らませること' },
  // 軸3 (E/F) F/T
  { axis:3, text:'私生活で何かを決める時には？', a:'最終的に自分もしくは周りの感情を優先する。感情的納得感（これが好き、こうしたい等）を大事にする。', b:'ロジカルな結論を選ぶ。論理的納得感（こうするのが理にかなっている等）を大事にする。' },
  { axis:3, text:'人との会話では？', a:'共感や感情的なつながりを大事にしている。', b:'役立つ・実利的な情報を共有することを大事にしている。' },
  { axis:3, text:'ご自分の性格を表す表現が多く含まれるのは？', a:'情に脆い、涙もろい、感情に流されやすい、感動屋さん、美しいものが好き、人の心に関心がある', b:'冷静沈着、戦略的、女性よりも男性と打ち解けやすい、機械やシステム（人の体含む）に関心がある' },
  // 軸4 (G/H) P/J
  { axis:4, text:'自分一人で予定のない休日を過ごす時には？（今そうでない方は、独身で子どももいなかった頃について教えてください）', a:'計画を立ててもその時の気分を優先してそれに従わない、もしくは計画は立てない。', b:'計画を立て、その通りに進めるのが心地よい。' },
  { axis:4, text:'人との待ち合わせには？', a:'ギリギリもしくは時間を過ぎて到着することが多い。', b:'余裕を持って到着することが多い。' },
  { axis:4, text:'部屋や机周りが散らかっていると？', a:'パフォーマンスに影響はない。', b:'集中できない。' },
  { axis:4, text:'より得意なのは？', a:'物事を新たに始める方が終わらせるよりも得意である。', b:'物事を終わらせる方が新たに始めるよりも得意である。' },
  { axis:4, text:'私生活では？', a:'考えきる前にとりあえずやってみる、当たって砕けろタイプである。', b:'十分にシミュレーションした上で動き出す、石橋を叩いて渡るタイプである。' },
];

const AXIS_LABELS = {
  1: { label:'第1軸', name:'エネルギーの向き', badge:'axis-1' },
  2: { label:'第2軸', name:'情報の受け取り方', badge:'axis-2' },
  3: { label:'第3軸', name:'判断の仕方', badge:'axis-3' },
  4: { label:'第4軸', name:'生活スタイル', badge:'axis-4' },
};

// 16タイプのデータ
const TYPES = {
  ISTJ: {
    strength: ['その人を形づくるもの（家庭のしきたり、育った家族、思い出など）を尊重する','よき市民として、社会・コミュニティで十分な責任を果たそうとする','取り組みを単発で終わらせず、習慣化する/繰り返せるよう手順を整える','緻密な作業を正確に行う'],
    hidden: ['タスクを片っ端から片付ける','効果・効率を最大化することを考え、無駄を省く','リソース配分、人を適所にアサインする、リーダーシップ','問題を解決する'],
    like: ['ルーティーン業務を正確に進めること','マニュアル・手順を整備すること','家族・大事な人たちのケアをすること'],
    dislike: ['ルーティーンを邪魔されること','未知の多い新たな環境に身を置くこと','大きなリスクを取って挑戦すること'],
    workstyle: '想いやビジョンよりも、ご自分の能力が最大限発揮でき、それに見合った評価が得られる働き方を渇望します。\n\nまた、どうしても必要のあるケースを除いて「これまでのやり方」「すでにうまく行くことが分かっている方法」を踏襲することを好み、失敗のない安全なやり方で着実に結果を出そうとします。\n\n組織で働くことを好む傾向にあり、そこで上下関係を大事にし、強い責任感で役割を全うします。「この人に任せれば安心」という信頼を周りから持たれることが多く、それがあなたのモチベーションとなるステイタスや社会的評価の獲得につながります。\n\n人の役に立ちたいという気持ち、またマニュアル・手順の整備などの得意を活かし、チームメンバーがミスなく仕事を進められるような環境整備をする役割が担えると、やりがいが感じられるはずです。'
  },
  ISFJ: {
    strength: ['その人を形づくるもの（家庭のしきたり、育った家族、思い出など）を尊重する','よき市民として、社会・コミュニティで十分な責任を果たそうとする','取り組みを単発で終わらせず、習慣化する/繰り返せるよう手順を整える','緻密な作業を正確に行う'],
    hidden: ['相手の先にいる第三者にまで思いを巡らせた上で、相手のニーズを読み、それを満たす','集団全体の和が保たれるよう、働きかける','社会・コミュニティが自分に期待していることを読み取り、応える'],

// ABCD→MBTI変換
// 軸1: A=I, B=E / 軸2: A=S, B=N / 軸3: A=F, B=T / 軸4: A=P, B=J
function getType(answers) {
  const counts = {1:{A:0,B:0}, 2:{A:0,B:0}, 3:{A:0,B:0}, 4:{A:0,B:0}};
  answers.forEach((ans, i) => {
    const axis = QUESTIONS[i].axis;
    if (ans === 'A' || ans === 'B') counts[axis][ans]++;
  });
  // A多数→I/S/F/P、B多数→E/N/T/J
  const dim1 = counts[1].A >= counts[1].B ? 'I' : 'E';
  const dim2 = counts[2].A >= counts[2].B ? 'S' : 'N';
  const dim3 = counts[3].A >= counts[3].B ? 'F' : 'T';
  const dim4 = counts[4].A >= counts[4].B ? 'P' : 'J';
  return { code: dim1+dim2+dim3+dim4, counts, dim1, dim2, dim3, dim4 };
}

function startDiagnosis() {
  answers = new Array(20).fill(null);
  currentQ = 0;
  showScreen('questions');

}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  window.scrollTo(0,0);
}

function renderQ() {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;
  const pct = Math.round((currentQ / total) * 100);

  document.getElementById('progress-text').textContent = `質問 ${currentQ+1} / ${total}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  const ax = AXIS_LABELS[q.axis];
  document.getElementById('axis-badge-wrap').innerHTML =
    `<span class="axis-badge ${ax.badge}">${ax.label}：${ax.name}</span>`;

  document.getElementById('q-number').textContent = `質問 ${currentQ+1}`;
  document.getElementById('q-text').textContent = q.text;

  const choicesEl = document.getElementById('choices');
  const sel = answers[currentQ];
  choicesEl.innerHTML = `
    <button class="choice-btn${sel==='A'?' selected':''}" onclick="selectAnswer('A')">
      <span class="choice-inner"><span class="choice-label">A</span>${q.a}</span>
    </button>
    <button class="choice-btn${sel==='B'?' selected':''}" onclick="selectAnswer('B')">
      <span class="choice-inner"><span class="choice-label">B</span>${q.b}</span>
    </button>
  `;

  document.getElementById('btn-prev').style.display = currentQ === 0 ? 'none' : '';
  document.getElementById('btn-next').textContent = currentQ === total-1 ? '結果を見る →' : '次へ →';
  document.getElementById('btn-next').disabled = sel === null;
}

function selectAnswer(val) {
  answers[currentQ] = val;
  document.querySelectorAll('.choice-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === (val==='A'?0:1));
    btn.querySelectorAll('.choice-label').forEach((lbl, li) => {
      // handled by CSS
    });
  });
  document.getElementById('btn-next').disabled = false;
}

function nextQ() {
  if (answers[currentQ] === null) return;
  if (currentQ < QUESTIONS.length - 1) {
    currentQ++;
    renderQ();
  } else {
    showResult();
  }
}

function prevQ() {
  if (currentQ > 0) { currentQ--; renderQ(); }
}
